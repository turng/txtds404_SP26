        <h1>Poor Puss.</h1>
        
        <p>———</p>
        
        <p>Why is Pussy in bed?</p>
        <p>She is sick, says the fly,</p>
        <p>And I fear she will die;</p>
        <p>And that's why she's in bed.</p>
        
        <p>———</p>
        
        <p>Pray what's her disorder?</p>
        <p>A lock'd-jaw is come on,</p>
        <p>Said the fine downy swan;</p>
        <p>And that's her disorder.</p>
