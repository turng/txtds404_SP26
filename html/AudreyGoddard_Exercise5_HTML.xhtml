        <title>The Nightingale</title>
    </head>

    <body style="background-color: #f5f5ecdc;">
        <p>THE NIGHTINGALE.</p>
        <img src="AudreyGoddard-Nightingale-Image.jpg" width="200" height="120"></img>
        <p>The <i>Nightingale</i> doth sweetly sing,<br></br> To welcome in the cheerful
                spring.</p>
        <p>What a pretty bird the <i>Nightingale</i> is! How sweetly she sings! I could wish 'twas
            summer all the year for the sake of her good company.</p>
    </body>
